
<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 20px;
            max-width: 400px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            list-style: none;
            background: #eee;
            padding: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>To-Do List</h1>

        <input type="text" id="taskInput" placeholder="Enter a task">
        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function displayTasks() {
            let list = document.getElementById("taskList");
            list.innerHTML = "";

            tasks.forEach(function(task, index) {
                let li = document.createElement("li");

                li.innerHTML = `
                    <span class="${task.completed ? 'completed' : ''}">
                        ${task.name}
                    </span>
                    <div>
                        <button onclick="completeTask(${index})">✔</button>
                        <button onclick="deleteTask(${index})">❌</button>
                    </div>
                `;

                list.appendChild(li);
            });
        }

        function addTask() {
            let input = document.getElementById("taskInput");

            if (input.value.trim() === "") {
                alert("Enter a task!");
                return;
            }

            tasks.push({
                name: input.value,
                completed: false
            });

            saveTasks();
            input.value = "";
            displayTasks();
        }

        function completeTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            displayTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            displayTasks();
        }

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        displayTasks();
    </script>

</body>
</html>
