
<!DOCTYPE html>
<html>
<head>
    <title>Product Catalogue</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        input, select {
            padding: 10px;
            margin: 10px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .product {
            background: white;
            padding: 20px;
            margin: 10px;
            width: 150px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h2>Product Catalogue</h2>

    <input type="text" id="search"
           placeholder="Search product..." onkeyup="display()">

    <select id="category" onchange="display()">
        <option value="All">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Clothing">Clothing</option>
        <option value="Books">Books</option>
    </select>

    <div class="container" id="products"></div>

    <script>

        let items = [
            {name: "Laptop", price: 50000, category: "Electronics"},
            {name: "Mobile", price: 20000, category: "Electronics"},
            {name: "Shirt", price: 800, category: "Clothing"},
            {name: "Jeans", price: 1200, category: "Clothing"},
            {name: "Python Book", price: 500, category: "Books"}
        ];

        function display() {

            let search = document.getElementById("search").value.toLowerCase();
            let category = document.getElementById("category").value;

            let result = items.filter(function(p) {
                return p.name.toLowerCase().includes(search) &&
                (category == "All" || p.category == category);
            });

            let output = "";

            result.forEach(function(p) {
                output += `
                    <div class="product">
                        <h3>${p.name}</h3>
                        <p>Price: ₹${p.price}</p>
                        <p>Category: ${p.category}</p>
                    </div>
                `;
            });

            if (result.length == 0) {
                output = "No products found";
            }

            document.getElementById("products").innerHTML = output;
        }

        display();

    </script>

</body>
</html>
